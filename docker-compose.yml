services:
  mi-funcion-api: # FastAPI
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7072:80"
    volumes:
      - ./ItemsAPI:/app/ItemsAPI
    environment:
      DB_SERVER: "sql-server"
      DB_NAME: "CircuitsDB"
      DB_USER: "sa"
      DB_PASSWORD: "YourStrongPassword123"
    depends_on:
      sql-server:
        condition: service_healthy

  dashboard: # Dashboard // frontend
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard.py:/app/dashboard.py
    environment:
      API_BASE_URL: "http://mi-funcion-api:80"
    depends_on:
      - mi-funcion-api

  sql-server: # BBDD
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "YourStrongPassword123"
      ACCEPT_EULA: "Y"
    command: /bin/bash /usr/src/app/entrypoint.sh
    ports:
      - "1433:1433"
    volumes:
      - ./db:/usr/src/app
      - sql-server-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrongPassword123", "-C", "-d", "CircuitsDB", "-Q", "SELECT 1 FROM circuits"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  sql-server-data:
